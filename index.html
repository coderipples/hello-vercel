<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1128">
  <title>Hello Linda</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint so there is no flash of the default
    try {
      var saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <section class="card">
      <h1>Hello Linda</h1>
      <p class="greeting" id="greeting" aria-live="polite">In twenty languages</p>
      <p class="language" id="language">Tap the button to begin</p>
      <button type="button" class="primary" id="cycle">Start</button>
    </section>
  </main>

  <nav class="themes" aria-label="Choose a theme">
    <div class="themes-inner">
      <button type="button" data-theme-choice="neon" aria-pressed="true">Neon</button>
      <button type="button" data-theme-choice="ios" aria-pressed="false">iOS</button>
      <button type="button" data-theme-choice="claude" aria-pressed="false">Claude</button>
      <button type="button" data-theme-choice="spy" aria-pressed="false">Spy</button>
      <button type="button" data-theme-choice="kids" aria-pressed="false">Kids</button>
    </div>
  </nav>
</body>
</html>
